# Java 回退部署，使用旧卷；切换前必须停止新服务并按回退说明合并账本。
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
    ports:
      - "3000:3000"
      - "3001:3001"
      - "6099:6099"
    volumes:
      - napcat-qq:/app/.config/QQ
      - napcat-config:/app/napcat/config
    networks:
      - botnet

  qqbot-fire:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: qqbot-fire
    restart: unless-stopped
    stdin_open: true
    ports:
      - "9988:9988"
    volumes:
      - qqbot-data:/app/data
    depends_on:
      - napcat
    networks:
      - botnet

volumes:
  napcat-qq:
    name: napcat-qq
  napcat-config:
    name: napcat-config
  qqbot-data:
    name: qqbot-fire-data

networks:
  botnet:
    name: qqbot-fire-net
    driver: bridge
