# 项目、管理页面、NapCat 和 QQ 运行在同一个容器。
services:
  qqbot-fire:
    build:
      context: .
      args:
        NAPCAT_IMAGE: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker@sha256:f611790ecffa23c3c182017d5cf68179dc24612403608cd835ad13d79642f1bd}
    restart: unless-stopped
    ports:
      - "${FIRE_BIND:-127.0.0.1}:${FIRE_PORT:-9988}:9988"
    environment:
      SCHEDULING_ENABLED: "${SCHEDULING_ENABLED:-false}"
      NAPCAT_AUTOSTART: "true"
      TZ: Asia/Shanghai
    volumes:
      - qqbot-data:/app/data
    shm_size: 512mb
    stop_grace_period: 60s
volumes:
  qqbot-data:
    # 与 Java 旧卷分开，防止启动时误读或同时写入原业务数据。
    name: ${FIRE_DATA_VOLUME:-qqbot-fire-typescript-data}
